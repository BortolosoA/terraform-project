# Gerado automaticamente pelo Terraform (resource local_file.ansible_inventory).
# Não edite este arquivo manualmente: ele é sobrescrito a cada "terraform apply".
# A VM já sobe com o usuário ubuntu configurado via cloud-init, então só
# existe um grupo aqui (sem play de bootstrap como root).

[korp]
korp-host ansible_host=

[korp:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
